name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evaluate:
    name: RAG evaluation harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Embedding and reranker models are downloaded from Hugging Face on
      # first use; cache them so later runs are faster.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-all-MiniLM-L6-v2-ms-marco-MiniLM-L-6-v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: the default Linux build pulls in several GB of GPU libraries.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run evaluation harness
        env:
          # If this secret is not set, the answer-accuracy tests are skipped
          # and only the retrieval, chunking, and data quality tests run.
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
        run: python -m pytest -v
